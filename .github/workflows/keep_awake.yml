name: Keep Hugging Face Space Awake

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space
        run: |
          # Replace the URL below with your actual HF Space URL once created
          curl -I https://clearview-backend.hf.space/health || echo "Space waking up..."
